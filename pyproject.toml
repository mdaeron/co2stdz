[project]
name = "co2stdz"
version = "0.0.3"
description = "Process and standardize spectroscopic analyses of CO2 isotopologues by comparison with reference materials of known composition"
authors = [{name = "Mathieu Daëron", email = "mathieu@daeron.fr"}]
readme = "readme.md"
license = "MIT"
classifiers = ["License :: OSI Approved :: MIT License"]

requires-python = ">=3.14"
dependencies = [
    "lmfit>=1.3.4",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"
