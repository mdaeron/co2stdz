[project]
authors = [{name = "mdaeron", email = "mathieu@daeron.fr"}]
description = "Process and standardize spectroscopic analyses of CO2 isotopologues"
dynamic = ["version"]
name = "co2stdz"
requires-python = ">= 3.11"
readme = "readme.md"

[dependencies]
numpy = ">=2.1.3,<3"
pandas = ">=2.2.3,<3"
lmfit = ">=1.3.2,<2"
scikit-learn = ">=1.5.2,<2"
matplotlib = ">=3.9.2,<4"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
co2stdz = { path = ".", editable = true }

[tool.pixi.dependencies]
numpy = ">=2.1.3,<3"
pandas = ">=2.2.3,<3"
lmfit = ">=1.3.2,<2"
scikit-learn = ">=1.5.2,<2"
matplotlib = ">=3.9.2,<4"
tabulate = ">=0.9.0,<0.10"
flit = ">=3.10.1,<4"
pytest = ">=8.3.3,<9"
pdoc = ">=14.4.0,<15"

[tool.pixi.tasks]
publish = {cmd = 'flit publish'}
test = {cmd = 'pytest'}
examples = {cmd = 'python examples.py', cwd = 'examples'}
doc     = {cmd = 'python ../build_doc.py', cwd = 'src', depends-on = ['examples']}
